[project]
name = "one-click-drf"
version = "0.1.7"
description = "One command to generate a production-ready Django REST backend"
readme = "README.md"
authors = [
    { name = "Shemanto Sharkar", email = "shemantosharkarofficial@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "rich>=14.3.2",
    "typer>=0.21.1",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "twine>=6.2.0",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=3.6.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "tox>=4.23.0",
]

[tool.uv.workspace]
members = [
    "test_vcs_none",
]

[project.scripts]
ocd = "one_click_drf.cli:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src/one_click_drf",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["src/one_click_drf"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*", "jinja2.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B603", "B607", "B404"]  # subprocess without shell=True is safe, subprocess import is acceptable
