[tox]
env_list = py312,py313,lint,type
min_version = 4.0

[testenv]
description = Run tests with pytest
deps =
    pytest>=8.0.0
    pytest-cov>=6.0.0
commands =
    pytest {posargs:tests}

[testenv:py312]
base_python = python3.12

[testenv:py313]
base_python = python3.13

[testenv:lint]
description = Run linting with ruff
deps = ruff>=0.8.0
commands =
    ruff format --check .
    ruff check .

[testenv:type]
description = Run type checking with mypy
deps =
    mypy>=1.13.0
commands =
    mypy src/one_click_drf

[testenv:security]
description = Run security scanning with bandit
deps = bandit[toml]>=1.8.0
commands =
    bandit -r src/one_click_drf -c pyproject.toml

[testenv:docs]
description = Build documentation with mkdocs
deps =
    mkdocs>=1.6.0
    mkdocs-material>=9.5.0
commands =
    mkdocs build --strict

[testenv:docs-serve]
description = Serve documentation locally
deps =
    mkdocs>=1.6.0
    mkdocs-material>=9.5.0
commands =
    mkdocs serve
