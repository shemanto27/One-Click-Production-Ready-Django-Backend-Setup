site_name: One Click DRF
site_description: One command to generate a production-ready Django REST backend
site_author: Shemanto Sharkar
site_url: https://github.com/shemanto27/One-Click-Production-Ready-Django-Backend-Setup

repo_name: shemanto27/One-Click-Production-Ready-Django-Backend-Setup
repo_url: https://github.com/shemanto27/One-Click-Production-Ready-Django-Backend-Setup

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - CLI Commands: user-guide/cli-commands.md
      - Project Structure: user-guide/project-structure.md
      - Configuration: user-guide/configuration.md
  - Contributing:
      - How to Contribute: contributing.md
      - Code of Conduct: code-of-conduct.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search
